<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Merge Court</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Agent PR triage</p>
    <h1>Merge Court</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="merge-court-title merge-court-desc">
        <title id="merge-court-title">Merge Court</title>
        <desc id="merge-court-desc">Flowchart of the agent pull-request pipeline: evidence checks, a fixed-rule risk gate, a fresh-context review with at most three fix rounds, and a destructive-action gate, with high-risk, stalled, and production-touching PRs routed to a human queue before the verdict, and a weekly calibration loop that tightens the risk gate.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- ============ ARROWS (drawn before nodes) ============ -->
        <g fill="none" stroke="#4f5d75" stroke-width="1.2">
          <!-- main rail -->
          <line x1="172" y1="200" x2="212" y2="200" marker-end="url(#arrow)"/>
          <line x1="316" y1="200" x2="356" y2="200" marker-end="url(#arrow)"/>
          <line x1="476" y1="200" x2="516" y2="200" marker-end="url(#arrow)"/>
          <line x1="620" y1="200" x2="660" y2="200" marker-end="url(#arrow)"/>
          <line x1="764" y1="200" x2="804" y2="200" marker-end="url(#arrow)"/>
          <!-- down to human queue -->
          <line x1="264" y1="244" x2="264" y2="316" marker-end="url(#arrow)"/>
          <line x1="568" y1="244" x2="568" y2="316" marker-end="url(#arrow)"/>
          <line x1="712" y1="244" x2="712" y2="316" marker-end="url(#arrow)"/>
          <!-- human decides verdict -->
          <path d="M744 348 H840 Q848 348 848 340 V232" marker-end="url(#arrow)"/>
          <!-- verdict feeds calibration (weekly) -->
          <path d="M868 168 V64 Q868 56 860 56 H640" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
          <!-- calibration tightens risk gate -->
          <path d="M400 56 H272 Q264 56 264 64 V156" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
          <!-- fix-round return loop, hop over the calibration line at x=264 -->
          <path d="M568 156 V128 Q568 120 560 120 H270 A6 6 0 0 0 258 120 H108 Q100 120 100 128 V160" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        </g>

        <!-- ============ ARROW LABELS (masked, 8px gap) ============ -->
        <g font-family="'Geist Mono', monospace" font-size="8" fill="#7a8399" letter-spacing="0.06em" text-anchor="middle">
          <rect x="324" y="180" width="24" height="12" rx="2" fill="#f5f5f5"/>
          <text x="336" y="189">LOW</text>
          <rect x="626" y="180" width="28" height="12" rx="2" fill="#f5f5f5"/>
          <text x="640" y="189">PASS</text>
          <rect x="775" y="180" width="18" height="12" rx="2" fill="#f5f5f5"/>
          <text x="784" y="189">NO</text>

          <rect x="272" y="274" width="56" height="12" rx="2" fill="#f5f5f5"/>
          <text x="300" y="283">HIGH RISK</text>
          <rect x="576" y="274" width="48" height="12" rx="2" fill="#f5f5f5"/>
          <text x="600" y="283">3 ROUNDS</text>
          <rect x="720" y="274" width="56" height="12" rx="2" fill="#f5f5f5"/>
          <text x="748" y="283">PROD CALL</text>

          <rect x="768" y="328" width="44" height="12" rx="2" fill="#f5f5f5"/>
          <text x="790" y="337">DECIDES</text>
          <rect x="728" y="36" width="40" height="12" rx="2" fill="#f5f5f5"/>
          <text x="748" y="45">WEEKLY</text>
          <rect x="310" y="36" width="44" height="12" rx="2" fill="#f5f5f5"/>
          <text x="332" y="45">TIGHTEN</text>
          <rect x="148" y="100" width="64" height="12" rx="2" fill="#f5f5f5"/>
          <text x="180" y="109">FIX · MAX 3</text>
        </g>

        <!-- ============ NODES ============ -->
        <!-- 1. Evidence checks (intake + scope + oracle + mutation) -->
        <rect x="28" y="160" width="144" height="80" rx="6" fill="#f5f5f5"/>
        <rect x="28" y="160" width="144" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="36" y="166" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="52" y="175" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">SPEC</text>
        <text x="100" y="198" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Evidence checks</text>
        <text x="100" y="214" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">intake · scope</text>
        <text x="100" y="228" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">oracle · mutation</text>

        <!-- 2. Risk gate (decision) -->
        <polygon points="212,200 264,156 316,200 264,244" fill="#f5f5f5"/>
        <polygon points="212,200 264,156 316,200 264,244" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="264" y="198" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Risk gate</text>
        <text x="264" y="212" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">fixed rules</text>

        <!-- 3. Fresh-context reviewer -->
        <rect x="356" y="168" width="120" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="356" y="168" width="120" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="416" y="200" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Fresh reviewer</text>
        <text x="416" y="216" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">diff + spec only</text>

        <!-- 4. Stop rule (decision) -->
        <polygon points="516,200 568,156 620,200 568,244" fill="#f5f5f5"/>
        <polygon points="516,200 568,156 620,200 568,244" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="568" y="198" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Passed?</text>
        <text x="568" y="212" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">stop rule</text>

        <!-- 5. Destructive-action gate (decision) -->
        <polygon points="660,200 712,156 764,200 712,244" fill="#f5f5f5"/>
        <polygon points="660,200 712,156 764,200 712,244" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="712" y="198" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Prod call?</text>
        <text x="712" y="212" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">fails closed</text>

        <!-- 6. Verdict + evidence bundle (end) -->
        <rect x="804" y="168" width="128" height="64" rx="20" fill="#f5f5f5"/>
        <rect x="804" y="168" width="128" height="64" rx="20" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="868" y="198" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Verdict</text>
        <text x="868" y="214" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">+ evidence bundle</text>

        <!-- 7. High-risk human queue (focal) -->
        <rect x="232" y="316" width="512" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="232" y="316" width="512" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
        <rect x="240" y="322" width="40" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.55)" stroke-width="0.8"/>
        <text x="260" y="331" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HUMAN</text>
        <text x="488" y="348" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">High-risk queue</text>
        <text x="488" y="364" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">founder approves · auth, billing, migrations, infra, prod</text>

        <!-- 8. Calibration loop -->
        <rect x="400" y="24" width="240" height="64" rx="6" fill="#f5f5f5"/>
        <rect x="400" y="24" width="240" height="64" rx="6" fill="#ffffff" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3"/>
        <rect x="408" y="30" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="424" y="39" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MOAT</text>
        <text x="520" y="56" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Calibration loop</text>
        <text x="520" y="72" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">seeded faults · catch rate</text>

        <!-- ============ LEGEND ============ -->
        <line x1="28" y1="412" x2="932" y2="412" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <g font-family="'Geist Mono', monospace" font-size="8" fill="#4f5d75" letter-spacing="0.06em">
          <text x="28" y="440" letter-spacing="0.14em">LEGEND</text>
          <rect x="100" y="432" width="20" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="128" y="441">STEP</text>
          <polygon points="180,438 188,431 196,438 188,445" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="204" y="441">DECISION</text>
          <rect x="272" y="432" width="20" height="12" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
          <text x="300" y="441">VERDICT (END)</text>
          <rect x="392" y="432" width="20" height="12" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
          <text x="420" y="441">HUMAN DECISION</text>
          <line x1="520" y1="438" x2="548" y2="438" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4"/>
          <text x="556" y="441">RETURN / FEEDBACK LOOP</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
