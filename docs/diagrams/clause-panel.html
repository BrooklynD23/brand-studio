<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adversarial Clause Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Agent debate, grounded clauses</p>
    <h1>Adversarial Clause Panel</h1>

    <div class="diagram-container">
      <svg viewBox="0 0 960 668" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="clause-panel-title clause-panel-desc">
        <title id="clause-panel-title">Adversarial Clause Panel</title>
        <desc id="clause-panel-desc">Flowchart of a contract review where a coordinator hands disputed clauses to a client advocate and a counterparty simulator to debate, a risk scorer sends any recommendation not tied to a quoted clause back to the debate, a judge rules, and a human lawyer reviews before any advice is used.</desc>
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>

        <!-- Zone: debate (painted first) -->
        <rect x="220" y="208" width="520" height="96" rx="8" fill="none" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="4,3"/>
        <text x="232" y="222" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">DISPUTED CLAUSES</text>

        <!-- ===== Arrows (before nodes) ===== -->
        <!-- Contract -> Coordinator -->
        <line x1="480" y1="80" x2="480" y2="118" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

        <!-- Coordinator -> Advocate / Simulator (fanned attach points) -->
        <path d="M452,176 V184 Q452,192 444,192 H348 Q340,192 340,200 V226" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <path d="M508,176 V184 Q508,192 516,192 H612 Q620,192 620,200 V226" fill="none" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

        <!-- Debate: both directions, offset 16px -->
        <line x1="440" y1="248" x2="518" y2="248" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <line x1="520" y1="264" x2="442" y2="264" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <rect x="459" y="230" width="42" height="12" rx="2" fill="#f5f5f5"/>
        <text x="480" y="239" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DEBATE</text>

        <!-- Advocate / Simulator -> merge dot -> Risk scorer -->
        <path d="M340,284 V304 Q340,312 348,312 H476" fill="none" stroke="#4f5d75" stroke-width="1"/>
        <path d="M620,284 V304 Q620,312 612,312 H484" fill="none" stroke="#4f5d75" stroke-width="1"/>
        <line x1="480" y1="316" x2="480" y2="330" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>

        <!-- Risk scorer NO -> back to debate (dashed return) -->
        <path d="M380,380 H188 Q180,380 180,372 V264 Q180,256 188,256 H238" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <rect x="248" y="362" width="84" height="12" rx="2" fill="#f5f5f5"/>
        <text x="290" y="371" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">NO: UNGROUNDED</text>

        <!-- Risk scorer YES -> Judge -->
        <line x1="480" y1="428" x2="480" y2="458" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <rect x="488" y="437" width="68" height="12" rx="2" fill="#f5f5f5"/>
        <text x="522" y="446" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">YES: QUOTED</text>

        <!-- Judge -> Human lawyer review (headline path) -->
        <line x1="560" y1="488" x2="638" y2="488" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
        <rect x="576" y="470" width="48" height="12" rx="2" fill="#f5f5f5"/>
        <text x="600" y="479" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">VERDICT</text>

        <!-- Human lawyer review -> Advice used -->
        <line x1="740" y1="516" x2="740" y2="554" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
        <rect x="748" y="529" width="56" height="12" rx="2" fill="#f5f5f5"/>
        <text x="776" y="538" fill="#7a8399" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">APPROVED</text>

        <!-- ===== Nodes ===== -->
        <!-- Contract (start oval) -->
        <rect x="400" y="40" width="160" height="40" rx="20" fill="#f5f5f5"/>
        <rect x="400" y="40" width="160" height="40" rx="20" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <text x="480" y="58" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Contract</text>
        <text x="480" y="71" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">one draft</text>

        <!-- Coordinator -->
        <rect x="400" y="120" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="400" y="120" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="408" y="126" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="424" y="135" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AGENT</text>
        <text x="480" y="154" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Coordinator</text>
        <text x="480" y="168" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">picks disputed clauses</text>

        <!-- Client advocate -->
        <rect x="240" y="228" width="200" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="240" y="228" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="248" y="234" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="264" y="243" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AGENT</text>
        <text x="340" y="262" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Client advocate</text>
        <text x="340" y="276" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">argues for client</text>

        <!-- Counterparty simulator -->
        <rect x="520" y="228" width="200" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="520" y="228" width="200" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="528" y="234" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="544" y="243" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AGENT</text>
        <text x="620" y="262" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Counterparty simulator</text>
        <text x="620" y="276" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">argues other side</text>

        <!-- Merge dot -->
        <circle cx="480" cy="312" r="4" fill="#2d3142"/>

        <!-- Risk scorer (decision diamond) -->
        <polygon points="480,332 580,380 480,428 380,380" fill="#f5f5f5"/>
        <polygon points="480,332 580,380 480,428 380,380" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="480" y="378" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Risk scorer</text>
        <text x="480" y="392" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">quoted clause?</text>

        <!-- Judge -->
        <rect x="400" y="460" width="160" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="400" y="460" width="160" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <rect x="408" y="466" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
        <text x="424" y="475" fill="rgba(45,49,66,0.8)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">AGENT</text>
        <text x="480" y="494" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Judge</text>
        <text x="480" y="508" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">rules per clause</text>

        <!-- Human lawyer review (focal) -->
        <rect x="640" y="460" width="200" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="640" y="460" width="200" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
        <rect x="648" y="466" width="32" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.60)" stroke-width="0.8"/>
        <text x="664" y="475" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">HUMAN</text>
        <text x="740" y="494" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Human lawyer review</text>
        <text x="740" y="508" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">signs off before use</text>

        <!-- Advice used (end oval) -->
        <rect x="660" y="556" width="160" height="40" rx="20" fill="#f5f5f5"/>
        <rect x="660" y="556" width="160" height="40" rx="20" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <text x="740" y="574" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Advice used</text>
        <text x="740" y="587" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sent to client</text>

        <!-- ===== Legend ===== -->
        <line x1="30" y1="620" x2="930" y2="620" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="30" y="646" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.14em">LEGEND</text>

        <rect x="120" y="636" width="28" height="14" rx="7" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
        <text x="156" y="646" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Start / end</text>

        <rect x="260" y="636" width="28" height="14" rx="3" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="296" y="646" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Agent step</text>

        <polygon points="412,635 424,643 412,651 400,643" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
        <text x="432" y="646" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Decision</text>

        <rect x="520" y="636" width="28" height="14" rx="3" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
        <text x="556" y="646" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Human gate</text>

        <line x1="660" y1="643" x2="692" y2="643" stroke="#4f5d75" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="700" y="646" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace">Sent back</text>
      </svg>
    </div>
  </div>
</body>
</html>
